<!DOCTYPE html>
<html>
<head>
<script>
  var l = window.location;
  l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    '/medtox/' +
    '?p=/' + l.pathname.replace('/medtox/', '').replace(/^\//, '').replace(/&/g, '~and~') +
    (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
</html>
